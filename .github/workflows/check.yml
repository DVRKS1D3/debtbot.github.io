name: Проверка сайта

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: index.html собран из releases.json
        run: node tools/build.mjs --check

      - name: Разметка, ссылки и стили согласованы
        run: python tools/check.py
