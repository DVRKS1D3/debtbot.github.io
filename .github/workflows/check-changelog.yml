name: Проверка страницы обновлений

on:
  push:
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Проверить, что index.html собран из releases.json
        run: node tools/build.mjs --check
